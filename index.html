<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./assets/css/root.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/ajustes-grid.css">
    <link rel="stylesheet" href="./assets/css/contenedor_rejilla.css">
    <link rel="stylesheet" href="./assets/css/casilla.css">
    <link rel="stylesheet" href="./assets/css/btn.css">
    <link rel="stylesheet" href="./assets/css/input-range.css">
    <link rel="stylesheet" href="./assets/css/background.css">
    <!-- <link rel="stylesheet" href="./assets/css/switch-theme.css"> -->
    <!-- <link rel="stylesheet" href="./assets/css/responsive.css"> -->
    <link rel="stylesheet" href="./assets/css/glass-effect.css">
    <link rel="stylesheet" href="./assets/css/navBar.css">
    <link rel="stylesheet" href="./assets/css/panel-ajustes.css">

    <title>Rejilla 128x128</title>
</head>

<body>
    <div id="navBar">
        <div id="navBar-menu" class="glass3d">
            <div class="icon" id="AjustesGrid-icon">
                <div id="AjustesGrid-tooltip" class="tooltip">Ajustes Grid</div>
                <img src="./assets/icons/grid-3x3.svg" class="icon-filter" alt="Ajustes">
                
                <div id="ajusteGrid-panel" class="glass3d panel-ajustes activo">
                    <div class="controles-numero">
                        <img id="ajusteGrid-btn-plus" src="./assets/icons/plus.svg" alt="" class="icon-filter btn">
                        <input type="text" id="ajusteGrid-number" value="10">
                        <img id="ajusteGrid-btn-minus" src="./assets/icons/minus.svg" alt="" class="icon-filter btn">
                    </div>
                    
                    <input type="range" id="range-ajusteGrid" name="range_ajustesGrid" min="10" value="10">
                </div>
            </div>

            <div class="icon">
                <div class="tooltip">Velocidad</div>
                <img src="./assets/icons/timer.svg" class="icon-filter" alt="">
            </div>
            <div class="icon">
                <div class="tooltip">Anterior / Siguiente</div>
                <img src="./assets/icons/list-video.svg" class="icon-filter" alt="">
            </div>
            <div class="icon">
                <div class="tooltip">Reiniciar</div>
                <img src="./assets/icons/rotate-ccw.svg" id="btn-reiniciar-grid" class="icon-filter" alt="">
            </div>
        </div>
    </div>

    <div id="contenedor_rejilla">
        <div id="grid" class="rejilla">
        </div>

        <!-- <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
        </label> -->
    </div>

    <script src="./assets/js/LogicaJuegoDeLaVida.js"></script>
    <script src="./assets/js/AjustesGrid.js"></script>
    <script src="./assets/js/script.js"></script>
</body>

</html>
