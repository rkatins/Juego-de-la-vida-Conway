<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./assets/css/root.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/ajustes-grid.css">
    <link rel="stylesheet" href="./assets/css/ajustes-velocidad.css">
    <link rel="stylesheet" href="./assets/css/ajustes-pasos.css">
    <link rel="stylesheet" href="./assets/css/ajustes-reiniciar.css">
    <link rel="stylesheet" href="./assets/css/contenedor_rejilla.css">
    <link rel="stylesheet" href="./assets/css/casilla.css">
    <link rel="stylesheet" href="./assets/css/btn.css">
    <link rel="stylesheet" href="./assets/css/input-range.css">
    <link rel="stylesheet" href="./assets/css/background.css">
    <link rel="stylesheet" href="./assets/css/glass-effect.css">
    <link rel="stylesheet" href="./assets/css/navBar.css">
    <link rel="stylesheet" href="./assets/css/panel-ajustes.css">
    <!-- <link rel="stylesheet" href="./assets/css/switch-theme.css"> -->
    <!-- <link rel="stylesheet" href="./assets/css/responsive.css"> -->

    <!-- Se pone `defer` si el JS accede al DOM -->
    <script src="./assets/js/NavBarController.js" defer></script>
    <script src="./assets/js/LogicaJuegoDeLaVida.js?v=2" defer></script>
    <script src="./assets/js/RejillaController.js?v=2" defer></script>
    <script src="./assets/js/AjusteGridController.js?v=2" defer></script>
    <script src="./assets/js/TiempoController.js?v=2" defer></script>
    <script src="./assets/js/PasosController.js?v=2" defer></script>
    <script src="./assets/js/ReiniciarController.js?v=2" defer></script>

    <title>Rejilla 128x128</title>
</head>

<body>
    <div id="navBar">
        <div id="navBar-menu" class="glass3d">
            <div class="icon" id="ajusteGrid-icon">
                <div id="ajusteGrid-tooltip" class="tooltip">Ajustes Grid</div>
                <img src="./assets/icons/grid-3x3.svg" class="icon-filter" alt="Ajustes">

                <div id="ajusteGrid-panel" class="glass3d panel-ajustes">
                    <img src="./assets/icons/x.svg" alt="" class="btn-close">
                    <div class="controles-numero">
                        <img id="ajusteGrid-btn-plus" src="./assets/icons/plus.svg" alt="" class="icon-filter">
                        <input type="text" id="ajusteGrid-number" value="10">
                        <img id="ajusteGrid-btn-minus" src="./assets/icons/minus.svg" alt="" class="icon-filter">
                    </div>

                    <input type="range" id="ajusteGrid-range" name="ajusteGrid-range" min="10" value="10"
                        oninput="AjustesGrid.fChangeInputRange()">

                </div>
            </div>

            <div class="icon" id="ajusteVelocidad-icon">
                <div id="ajusteVelocidad-tooltip" class="tooltip">Velocidad</div>
                <img src="./assets/icons/timer.svg" class="icon-filter" alt="Velocidad">

                <div id="ajusteVelocidad-panel" class="glass3d panel-ajustes">
                    <img src="./assets/icons/x.svg" alt="" class="btn-close">
                    <div class="controles-numero">
                        <img id="ajusteVelocidad-btn-plus" src="./assets/icons/plus.svg" alt="" class="icon-filter">
                        <input type="text" id="ajusteVelocidad-number" value="500">
                        <img id="ajusteVelocidad-btn-minus" src="./assets/icons/minus.svg" alt="" class="icon-filter">
                    </div>

                    <input type="range" id="ajusteVelocidad-range" name="ajusteVelocidad-range" min="100" max="2000"
                        value="500">
                </div>
            </div>

            <div class="icon" id="ajustePasos-icon">
                <div id="ajustePasos-tooltip" class="tooltip">Anterior / Siguiente</div>
                <img src="./assets/icons/list-video.svg" class="icon-filter" alt="Anterior / Siguiente">

                <div id="ajustePasos-panel" class="glass3d panel-ajustes">
                    <img src="./assets/icons/x.svg" alt="" class="btn-close">
                    <div class="controles-multimedia">
                        <img id="ajustePasos-btn-left" src="./assets/icons/chevron-left.svg" alt="" class="icon-filter">
                        <img id="ajustePasos-btn-play" src="./assets/icons/play.svg" alt="" class="icon-filter">
                        <img id="ajustePasos-btn-right" src="./assets/icons/chevron-right.svg" alt="" class="icon-filter">
                    </div>
                </div>
            </div>

            <div class="icon" id="ajusteReiniciar-icon" onclick="Reiniciar.fReiniciarJuego()">
                <div id="ajusteReiniciar-tooltip" class="tooltip">Reiniciar</div>
                <img src="./assets/icons/rotate-ccw.svg" id="btn-reiniciar-grid" class="icon-filter" alt="Reiniciar">
            </div>
        </div>
    </div>

    <div id="contenedor_rejilla">
        <div id="grid" class="rejilla">
        </div>

        <!-- <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
        </label> -->
    </div>
</body>

</html>
